name: Build PowerMon GUI

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  release:
    types: [ created ]
  workflow_dispatch:

jobs:
  build-windows:
    name: Build — Windows x64 GUI (MSVC 2022 + D2D)
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup MSVC x64
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: Configure CMake Release
        run: |
          cmake -B build -G "NMake Makefiles" `
            -DCMAKE_BUILD_TYPE=Release

      - name: Build
        run: cmake --build build --config Release --parallel

      - name: Verify
        run: |
          $exe = "build/powermon.exe"
          if (Test-Path $exe) {
            $kb = [math]::Round((Get-Item $exe).length / 1KB, 1)
            Write-Host "✅ powermon.exe — ${kb} KB"
            # Vérifier que c'est bien un GUI (pas console)
            $bytes = [System.IO.File]::ReadAllBytes($exe)
            $peOff = [BitConverter]::ToInt32($bytes, 0x3C)
            $subsys = [BitConverter]::ToInt16($bytes, $peOff + 0x5C)
            if ($subsys -eq 2) {
              Write-Host "✅ Subsystem: WINDOWS GUI (pas de CMD)"
            } else {
              Write-Warning "Subsystem: $subsys (attendu 2)"
            }
          } else {
            Write-Error "❌ powermon.exe manquant"
            exit 1
          }

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: powermon-windows-x64-gui
          path: build/powermon.exe
          retention-days: 30

      - name: Attach to Release
        if: github.event_name == 'release'
        uses: softprops/action-gh-release@v2
        with:
          files: build/powermon.exe
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
